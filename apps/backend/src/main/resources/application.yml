server:
  port: ${SERVER_PORT:${PORT:8080}}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:findit_local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

findit:
  demo:
    enabled: ${DEMO_MODE:false}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  match:
    threshold: ${AI_MATCH_THRESHOLD:45}
    date-window-days: ${AI_DATE_WINDOW_DAYS:90}
    poll-ms: ${MATCH_JOB_POLL_MS:5000}
