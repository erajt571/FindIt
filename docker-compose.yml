version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: findit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: findit
      POSTGRES_USER: findit
      POSTGRES_PASSWORD: findit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findit -d findit"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
